
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#d9d6ce" />
  <title>Robyn Wong Min Xuan</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap");

    :root { --paper:#d9d6ce; --ink:#3d3c39; --accent:#b34b3d; --sidebar:25vw; --pad:clamp(1.1rem,2.35vw,2.6rem); --left-size:clamp(.88rem,1.16vw,1.16rem); --info-size:clamp(.66rem,.84vw,.84rem); --rule-gap:.58rem; --title-size:clamp(1.24rem,3vw,3.41rem); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; overflow-x:hidden; color:var(--ink); background:var(--paper); font-family:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight:400; letter-spacing:-.055em; }
    a { color:inherit; text-decoration:none; } button,summary { font:inherit; }

    .fixed-background { position:fixed; z-index:-2; inset:0; background:var(--paper); }
    body.page-home .fixed-background { background:var(--paper) url("namly%20crescent.jpg") center center / cover no-repeat; }
    body.page-home .fixed-background::after { content:""; position:absolute; inset:0; background:rgba(255,255,255,.16); pointer-events:none; }

    .site-shell { display:grid; grid-template-columns:var(--sidebar) 1fr; }
    .sidebar { position:fixed; inset:0 auto 0 0; z-index:10; width:var(--sidebar); height:100svh; display:flex; flex-direction:column; padding:var(--pad); overflow:hidden; background:transparent; }
    .identity { width:100%; }
    .artist-name,.sidebar-nav a { color:var(--ink); font-size:var(--left-size); font-weight:500; line-height:1.14; letter-spacing:-.075em; }
    .artist-name { display:block; white-space:nowrap; text-transform:uppercase; }
    .artist-email,.upcoming,.upcoming h2,.upcoming .event,.upcoming .event-type,.upcoming time,.upcoming a,.upcoming .event-location { font-size:var(--info-size); font-weight:500; line-height:1.2; letter-spacing:-.055em; }
    .artist-email { display:block; margin-top:.28rem; color:var(--ink); text-transform:lowercase; overflow-wrap:anywhere; transition:color .18s ease; }
    .artist-email:hover { color:var(--accent); }
    .identity-rule { width:100%; height:1px; margin-top:var(--rule-gap); background:var(--ink); }
    .sidebar-nav { display:grid; gap:.55rem; margin-top:2.4rem; }
    .sidebar-nav a { text-transform:uppercase; transition:color .18s ease; }
    .sidebar-nav a:hover,.sidebar-nav a.active { color:var(--accent); }
    .upcoming { margin-top:auto; padding-top:1.5rem; }
    .small-heading { margin:0 0 .72rem; color:var(--accent); text-transform:uppercase; }
    .event { padding:.52rem 0 .7rem; }
    .event-type { display:block; margin-bottom:.32rem; color:var(--accent); text-transform:uppercase; }
    .event time { display:block; }
    .event a,.event-location { display:inline; color:var(--ink); }
    .event a { text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.15em; transition:color .18s ease; }
    .event a:hover { color:var(--accent); }

    .content { grid-column:2; min-width:0; padding:var(--pad); }
    .mobile-topbar { display:none; }
    .page { display:none; min-height:calc(100svh - (var(--pad) * 2)); animation:enter .25s ease both; }
    .page.active { display:block; }
    .page-home { min-height:calc(100svh - (var(--pad) * 2)); }
    @keyframes enter { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .home-empty { min-height:calc(100svh - (var(--pad) * 2)); }
    .page-header { display:block; border-bottom:1px solid var(--ink); }
    .page-title { margin:0; color:var(--ink); font-size:var(--left-size); font-weight:500; line-height:1.14; letter-spacing:-.075em; text-transform:uppercase; }
    .page-selected { height:calc(var(--info-size) * 1.2); margin:.28rem 0 0; color:var(--accent); font-size:var(--info-size); font-weight:500; line-height:1.2; letter-spacing:-.055em; text-transform:lowercase; }
    .page-rule-spacer { height:var(--rule-gap); }

    .about-layout { min-height:calc(100svh - (var(--pad) * 2)); display:grid; grid-template-columns:minmax(15rem,.92fr) minmax(0,1.08fr); align-items:center; gap:clamp(1.5rem,4vw,5rem); padding-top:clamp(1.5rem,4vh,3.5rem); }
    .artist-photo { position:relative; width:min(100%,28rem); aspect-ratio:3/4; justify-self:center; display:grid; place-items:center; overflow:hidden; border:1px solid var(--ink); color:var(--accent); font-size:clamp(.64rem,.85vw,.8rem); text-transform:uppercase; }
    .artist-photo::before { content:""; position:absolute; width:42%; aspect-ratio:1; border:1px solid var(--ink); border-radius:50%; }
    .artist-photo::after { content:"ARTIST PHOTO PLACEHOLDER"; position:relative; padding:.35rem; }
    .artist-photo img { width:100%; height:100%; object-fit:contain; object-position:center; display:block; background:transparent; }
    .about-copy { max-width:36rem; }
    .about-copy p { margin:0; font-size:clamp(.89rem,1.28vw,1.27rem); line-height:1.3; letter-spacing:-.07em; }
    .about-copy p+p { margin-top:1rem; }
    .about-note { color:var(--accent); font-size:clamp(.7rem,.84vw,.82rem)!important; line-height:1.28!important; text-transform:uppercase; }
    .cv-link { display:inline-block; margin-top:clamp(1.75rem,5vh,4rem); color:var(--accent); font-size:clamp(.9rem,1.2vw,1.2rem); font-weight:500; letter-spacing:-.075em; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.22em; text-transform:uppercase; transition:color .18s ease; }
    .cv-link:hover { color:var(--ink); }

    .project-list { padding-top:2rem; }
    .segment { scroll-margin-top:1rem; padding:0 0 clamp(3.5rem,7vw,7rem); margin-bottom:clamp(2.5rem,5vw,5rem); }
    /* Project title is the dropdown control. The content appears only below the form/role line. */
    .project-details { margin:0; }
    .project-summary { display:grid; grid-template-columns:1fr auto; align-items:baseline; gap:1rem; cursor:pointer; list-style:none; }
    .project-summary::-webkit-details-marker { display:none; }
    .project-name { margin:0; max-width:none; color:var(--ink); font-size:var(--title-size); font-weight:500; line-height:.88; letter-spacing:-.12em; text-transform:uppercase; }
    .project-summary .arrow { color:var(--accent); font-size:clamp(1.35rem,2.25vw,2.25rem); line-height:1; transition:transform .25s ease,color .25s ease; }
    .project-details[open] .project-summary .arrow { transform:rotate(180deg); color:var(--ink); }
    .project-index { display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin:.55rem 0 .7rem; }
    .segment-genre,.segment-role { font-size:var(--left-size); font-weight:500; line-height:1.14; letter-spacing:-.075em; text-transform:uppercase; }
    .segment-genre { color:var(--accent); }
    .segment-role { color:var(--ink); text-align:right; }
    .project-details-content { display:none; }
    .project-details[open] .project-details-content { display:block; }

    /* Empty image-space frame: it has no outline. Contained images are centered; all unused frame space stays transparent. */
    .carousel { position:relative; width:100%; aspect-ratio:16/9; min-height:clamp(15rem,38vw,39rem); overflow:hidden; background:transparent; }
    .carousel-track { display:flex; width:100%; height:100%; transition:transform .42s cubic-bezier(.2,.75,.2,1); }
    .carousel-slide { flex:0 0 100%; width:100%; height:100%; display:grid; place-items:center; background:transparent; }
    .carousel-slide img { width:100%; height:100%; object-fit:contain; object-position:center; display:block; background:transparent; }
    .carousel-slide.placeholder-slide { position:relative; color:var(--accent); font-size:.72rem; text-transform:uppercase; }
    .carousel-slide.placeholder-slide::before { content:""; position:absolute; width:min(42%,16rem); aspect-ratio:1; border:1px solid var(--ink); border-radius:50%; opacity:.9; }
    .carousel-slide.placeholder-slide::after { content:attr(data-label); position:relative; padding:.4rem; }
    .carousel-slide.placeholder-square::before { border-radius:0; transform:rotate(45deg); }
    .carousel-slide.placeholder-portrait::before { width:min(29%,12rem); aspect-ratio:3/4; border-radius:0; }
    .carousel-slide.placeholder-landscape::before { width:min(58%,25rem); aspect-ratio:16/9; border-radius:0; }
    .carousel-button { position:absolute; z-index:2; top:50%; transform:translateY(-50%); display:grid; place-items:center; width:2.75rem; height:2.75rem; padding:0; border:0; color:var(--ink); background:transparent; cursor:pointer; font-size:clamp(1.55rem,2.8vw,2.7rem); line-height:1; transition:color .18s ease,transform .18s ease; }
    .carousel-button:hover,.carousel-button:focus-visible { color:var(--accent); outline:none; }
    .carousel-button:focus-visible { outline:1px solid var(--accent); outline-offset:3px; }
    .carousel-button.prev { left:.55rem; } .carousel-button.next { right:.55rem; }
    .carousel-button.prev:hover { transform:translate(-.15rem,-50%); } .carousel-button.next:hover { transform:translate(.15rem,-50%); }
    .carousel-count { position:absolute; z-index:2; right:.8rem; bottom:.7rem; color:var(--ink); font-size:.66rem; letter-spacing:-.04em; }
    .project-tags { display:flex; flex-wrap:wrap; align-items:center; gap:.25rem; margin:.7rem 0 .15rem; color:var(--accent); font-size:clamp(.68rem,.86vw,.84rem); font-weight:500; line-height:1.2; letter-spacing:-.055em; text-transform:uppercase; }
    .project-tags .tag { display:inline-flex; align-items:center; }
    .project-tags .tag:not(:last-child)::after { content:"·"; padding-left:.48rem; color:var(--ink); }
    /* Description body intentionally uses exactly the same type scale as the DESCRIPTION label. */
    .description-body,.description-body p,.presented-at,.collaborators { font-size:clamp(.7rem,.9vw,.88rem); font-weight:500; line-height:1.28; letter-spacing:-.055em; }
    .description-body { padding:.75rem 0 1rem; }
    .description-body p { max-width:44rem; margin:0; }
    .description-body p+p { margin-top:.7rem; }
